name: Build SbobinaFacile Installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper requests customtkinter pyinstaller certifi

      - name: Compila eseguibile con PyInstaller
        run: |
          pyinstaller --noconsole --onedir --name SbobinaFacile --collect-all customtkinter --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av --collect-all tokenizers --collect-all certifi --collect-all huggingface_hub sbobinatore_ai.py

      - name: Scarica motore AI locale Vulkan (llama.cpp)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "User-Agent"    = "GitHubActions"
          }
          $releases = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=15" -Headers $headers
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object { $_.name -like "*win*vulkan*.zip" -and $_.name -notlike "*arm64*" } | Select-Object -First 1
            if ($asset) { break }
          }
          if (-not $asset) {
            foreach ($r in $releases) {
              $asset = $r.assets | Where-Object { ($_.name -like "*win*cpu*.zip" -or $_.name -like "*win*avx2*.zip") -and $_.name -notlike "*arm64*" } | Select-Object -First 1
              if ($asset) { break }
            }
          }
          if (-not $asset) { throw "Nessun binario Windows trovato." }
          Invoke-WebRequest $asset.browser_download_url -OutFile llama.zip
          Expand-Archive llama.zip -DestinationPath "dist\SbobinaFacile\llama_bin" -Force

      - name: Crea Setup.exe con Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc installer.iss

      - name: Carica installer pronto per il download
        uses: actions/upload-artifact@v4
        with:
          name: Setup_SbobinaFacile
          path: installer_output/Setup_SbobinaFacile_v1.0.exe
